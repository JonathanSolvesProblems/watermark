[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ringwire"
version = "0.1.0"
description = "Typed Python client for the Ring Partner API (Amazon Vision API): devices, sensors, media, webhooks, account linking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jonathan Andrei" }]
keywords = ["ring", "amazon", "vision", "api", "webhooks", "sensors", "smart-home"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/JonathanSolvesProblems/ringwire"
Documentation = "https://developer.amazon.com/docs/ring/api-documentation.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
