[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-brain"
version = "0.1.0"
description = "Photos of a wet room to structured, adjuster-style damage findings. From the RenoScout Phase 0 brain."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7", "pillow>=10"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
watermark-brain = "watermark_brain.cli:main"

[tool.setuptools.packages.find]
include = ["watermark_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
