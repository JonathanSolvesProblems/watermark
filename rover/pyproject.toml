[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-rover"
version = "0.1.0"
description = "Watermark rover: carries a Ring Indoor Cam to the water when a Ring flood sensor fires. Runs on a Raspberry Pi 4."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
pi = ["gpiozero>=2.0", "pyserial>=3.5", "picamera2"]
iot = ["awsiotsdk>=1.21"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["rover"]
package-dir = { "rover" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
