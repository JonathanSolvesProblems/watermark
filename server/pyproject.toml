[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-server"
version = "0.1.0"
description = "Watermark: a Ring flood sensor fires, a Ring camera goes to the water, the homeowner gets a claim-ready evidence pack."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ringwire",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pillow>=10",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "awscrt>=0.20", "awsiotsdk>=1.21"]
capture = ["aiortc>=1.9", "av>=12"]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["watermark*"]

[tool.setuptools.package-data]
watermark = ["templates/*.html", "templates/*.css", "claim_questions.json", "chime_audio/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
