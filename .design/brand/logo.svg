<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <!-- A high-water plaque (refs NOTES 1, 15): a riveted plate split by the line, the record
       above it, the date below it. currentColor is the plate edge; the line is the brand red. -->
  <rect x="1" y="1" width="46" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="6" cy="6" r="1.6" fill="currentColor"/>
  <circle cx="42" cy="6" r="1.6" fill="currentColor"/>
  <circle cx="6" cy="26" r="1.6" fill="currentColor"/>
  <circle cx="42" cy="26" r="1.6" fill="currentColor"/>
  <rect x="11" y="8" width="26" height="3" fill="currentColor"/>
  <rect x="1" y="14.5" width="46" height="3" fill="#A3121D"/>
  <rect x="15" y="21" width="18" height="3" fill="currentColor"/>
</svg>
